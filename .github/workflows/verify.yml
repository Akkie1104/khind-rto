name: Validate KHIND RTO storefront

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax and storefront behavior
        run: |
          node --check script.js
          node --check catalogue.js
          node --check motion-2026.js
          node --check storefront.js
          node --check shopping-guide.js
          node --check swipe-shop.js
          node --check swipe-telemetry.js
          node --check swipe-experiment-entry.js
          node --check experiment-console.js
          node tests/swipe-shop.test.cjs
          node tests/swipe-variant-b.test.cjs
          node tests/swipe-variant-c.test.cjs
          node tests/swipe-rescue.test.cjs
          node tests/swipe-accessibility.test.cjs
          node tests/swipe-shortlist.test.cjs
          node tests/swipe-i18n.test.cjs
          node tests/swipe-telemetry.test.cjs
          node tests/swipe-analytics-events.test.cjs
          node tests/swipe-collector.test.cjs
      - name: Assert approved folio design and storefront safeguards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const html = fs.readFileSync('index.html', 'utf8');
          const folio = fs.readFileSync('khind-folio.css', 'utf8');
          const guide = fs.readFileSync('swipe-shop.js', 'utf8');
          const guideCss = fs.readFileSync('swipe-shop.css', 'utf8');
          const swipePage = fs.readFileSync('pilih/index.html', 'utf8');
          const checks = [
            ['homepage uses the approved folio design', html.includes('class="folio-home"') && html.includes('khind-folio.css?v=folio-6')],
            ['warm paper and yellow index palette are defined', folio.includes('--folio-paper:#f4f0e4') && folio.includes('--folio-yellow:#f3d31f')],
            ['yellow index-paper texture is present', folio.includes('index-paper-grain.png')],
            ['WM1248 cutout and product caption are present', html.includes('assets/plates/wm1248-product-photo.png') && html.includes('folio-product-caption') && html.includes('WM1248')],
            ['product caption asset exists', fs.existsSync('assets/plates/wm1248-product-photo.png')],
            ['homepage keeps agent and commercial-data disclosures', html.includes('Laman ejen bebas') && html.includes('perlu disahkan dengan KHIND')],
            ['swipe route loads local catalogue, shared scripts, and folio styling', swipePage.includes('../catalogue.js') && swipePage.includes('../swipe-shop.js') && swipePage.includes('../swipe-shop.css') && swipePage.includes('../khind-folio.css')],
            ['swipe card facts come from the product catalogue', guide.includes('window.KHIND_PRODUCTS') && guide.includes('p.image') && guide.includes('p.plans') && guide.includes('p.months')],
            ['swipe route keeps persistent Skip and Save controls', swipePage.includes('id="skip-button"') && swipePage.includes('id="save-button"')],
            ['swipe supports reduced-motion preferences', guideCss.includes('prefers-reduced-motion:reduce')],
            ['homepage canonical points to the customer domain', html.includes('href="https://khindrto.akizen.my/"')]
          ];
          const pages = ['catalogue', 'combos', 'promotions', 'cara-rto', 'faq', 'mohon', 'privasi'];
          const models = ['WM1248', 'DHP90', 'WD1468', 'RFS600A', 'RFM466A', 'RF480', 'WM150A', 'ACSON-1.0', 'ACSON-1.5', 'ACSON-2.0', 'SI6029BP', 'WD1438', 'CD12D', 'COMBO-1', 'COMBO-2', 'COMBO-3', 'COMBO-4', 'COMBO-5', 'COMBO-6', 'COMBO-7', 'COMBO-8', 'COMBO-9', 'COMBO-10'];
          const routeChecks = [
            ['all storefront sections exist', pages.every(name => fs.existsSync(`${name}/index.html`))],
            ['all SEO product pages exist', models.every(name => fs.existsSync(`products/${name}/index.html`))],
            ['agent disclosure appears on every section and product page', [...pages.map(name => `${name}/index.html`), ...models.map(name => `products/${name}/index.html`)].every(path => fs.readFileSync(path, 'utf8').includes('Laman promosi bebas'))],
            ['WhatsApp enquiries route to the independent agent', fs.readFileSync('mohon/index.html', 'utf8').includes('wa.me/60174201247')]
          ];
          for (const [description, passed] of [...checks, ...routeChecks]) console.log(`${passed ? 'PASS' : 'FAIL'} ${description}`);
          if ([...checks, ...routeChecks].some(([, passed]) => !passed)) process.exit(1);
          NODE
