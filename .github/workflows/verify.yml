name: Validate KHIND RTO storefront
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check catalogue.js
          node --check motion-2026.js
      - name: Assert essential storefront controls and privacy safeguards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('script.js','utf8');
          const css=fs.readFileSync('retail-2026.css','utf8');
          const motion=fs.readFileSync('motion-2026.css','utf8');
          const photography=fs.readFileSync('photo-2026.css','utf8');
          const checks=[
            ['studio photo stylesheet loaded',html.includes('photo-2026.css?v=photo-2')],
            ['generated hero local image exists',fs.existsSync('assets/wm1248-studio-hero.webp')],
            ['studio hero is labeled accurately',html.includes('Ilustrasi studio · Semak foto rasmi')],
            ['hero JS does not override studio with official photo',js.includes("featuredStudio?'assets/wm1248-studio-hero.webp'")],
            ['official WM1248 source link',html.includes('https://www.khindrto.com.my/products/9kg-front-load-washer-wm1248')],
            ['official catalogue WM1248 photo retained',fs.readFileSync('catalogue.js','utf8').includes('WM1248_Front%20Left.jpg')],
            ['realistic light image mat',photography.includes('mix-blend-mode:multiply')],
            ['motion assets loaded',html.includes('motion-2026.css')&&html.includes('motion-2026.js')],
            ['reduced motion supported',motion.includes('prefers-reduced-motion:reduce')],
            ['no perpetual motion loop',!(/animation[^;\n]*\binfinite\b/.test(motion))],
            ['fixed dark appearance',html.includes('data-theme="dark"')&&!html.includes('theme-toggle')],
            ['budget controls',['80','100','150','all'].every(value=>html.includes('data-budget="'+value+'"'))],
            ['budget uses regular rate',js.includes('plan.rate<=budgetCap')],
            ['normal rate and total disclosed',js.includes('shop-price-commitment')&&js.includes('money(sched.total+1)')],
            ['agent identity',html.includes('Ejen KHIND RTO Berdaftar')],
            ['privacy notice',html.includes('Jangan hantar gambar IC')],
            ['brand image',html.includes('id="hero-image"')],
            ['contrast styling',css.includes('Family-first KHIND RTO / dark-only system')],
            ['valid canonical',html.includes('href="https://khindrto.akizen.my/"')],
            ['no user theme persistence',!js.includes('localStorage.getItem(\'khind-theme\')')]
          ];
          for(const [description,passed] of checks){
            console.log((passed?'PASS ':'FAIL ')+description);
          }
          if(checks.some(([,passed])=>!passed))process.exit(1);
          NODE
