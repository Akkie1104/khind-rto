name: Validate KHIND RTO storefront
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check catalogue.js
          node --check motion-2026.js
          node --check storefront.js
          node --check shopping-guide.js
      - name: Assert essential storefront controls and privacy safeguards
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('script.js','utf8');
          const css=fs.readFileSync('retail-2026.css','utf8');
          const motion=fs.readFileSync('motion-2026.css','utf8');
          const guide=fs.readFileSync('shopping-guide.js','utf8');
          const guideCss=fs.readFileSync('shopping-guide.css','utf8');
          const photography=fs.readFileSync('photo-2026.css','utf8');
          const checks=[
            ['studio photo stylesheet loaded',html.includes('photo-2026.css?v=photo-2')],
            ['generated hero local image exists',fs.existsSync('assets/wm1248-studio-hero.webp')],
            ['studio hero is labeled accurately',html.includes('Ilustrasi studio · Semak foto rasmi')],
            ['hero JS does not override studio with official photo',js.includes("featuredStudio?'assets/wm1248-studio-hero.webp'")],
            ['official WM1248 source link',html.includes('https://www.khindrto.com.my/products/9kg-front-load-washer-wm1248')],
            ['official catalogue WM1248 photo retained',fs.readFileSync('catalogue.js','utf8').includes('WM1248_Front%20Left.jpg')],
            ['realistic light image mat',photography.includes('mix-blend-mode:multiply')],
            ['opt-in guided chooser mounted',html.includes('id="guided-shop"')&&html.includes('data-guide-open')],
            ['quiz scripts load locally',html.includes('shopping-guide.js?v=2')&&html.includes('shopping-guide.css?v=2')],
            ['recommendations use the normal monthly rate',guide.includes('monthly(p)<=cap')],
            ['no automatic first-visit pop-up',guide.includes('get("pilih")==="1"')],
            ['no misleading over-budget matches',guide.includes('Belum ada pelan dalam bajet ini')],
            ['swipe touch and mouse drag',guide.includes('"pointerdown"')&&guide.includes('"pointerup"')],
            ['swipe accessible buttons',guide.includes('data-swipe="skip"')&&guide.includes('data-swipe="save"')],
            ['swipe keyboard and undo',guide.includes('ArrowLeft')&&guide.includes('ArrowRight')&&guide.includes('function undo()')],
            ['shortlist limited to 3',guide.includes('state.saved.length>=3')],
            ['swipe deck limited to 6',guide.includes('suitable.slice(0,6)')],
            ['WhatsApp enquiry only for selected items',guide.includes('state.saved')&&guide.includes('wa.me/60174201247')],
            ['reduced motion supported by swipe deck',guideCss.includes('swipe-card')&&guideCss.includes('prefers-reduced-motion:reduce')],
            ['quiz stays accessible',guideCss.includes('prefers-reduced-motion:reduce')&&html.includes('aria-labelledby="guide-title"')],
            ['catalogue invites guided selection',fs.readFileSync('catalogue/index.html','utf8').includes('../?pilih=1')],
            ['motion assets loaded',html.includes('motion-2026.css')&&html.includes('motion-2026.js')],
            ['reduced motion supported',motion.includes('prefers-reduced-motion:reduce')],
            ['no perpetual motion loop',!(/animation[^;\n]*\binfinite\b/.test(motion))],
            ['fixed dark appearance',html.includes('data-theme="dark"')&&!html.includes('theme-toggle')],
            ['budget controls',['80','100','150','all'].every(value=>html.includes('data-budget="'+value+'"'))],
            ['budget uses regular rate',js.includes('plan.rate<=budgetCap')],
            ['normal rate and total disclosed',js.includes('shop-price-commitment')&&js.includes('money(sched.total+1)')],
            ['agent identity',html.includes('Ejen KHIND RTO Berdaftar')],
            ['privacy notice',html.includes('Jangan hantar gambar IC')],
            ['brand image',html.includes('id="hero-image"')],
            ['contrast styling',css.includes('Family-first KHIND RTO / dark-only system')],
            ['valid canonical',html.includes('href="https://khindrto.akizen.my/"')],
            ['no user theme persistence',!js.includes('localStorage.getItem(\'khind-theme\')')]
          ];
          for(const [description,passed] of checks){
            console.log((passed?'PASS ':'FAIL ')+description);
          }
          const pages=['catalogue','combos','promotions','cara-rto','faq','mohon','privasi'];
          const models=['WM1248','DHP90','WD1468','RFS600A','RFM466A','RF480','WM150A','ACSON-1.0','ACSON-1.5','ACSON-2.0','SI6029BP','WD1438','CD12D','COMBO-1','COMBO-2','COMBO-3','COMBO-4','COMBO-5','COMBO-6','COMBO-7','COMBO-8','COMBO-9','COMBO-10'];
          const shopChecks=[
            ['all storefront sections exist',pages.every(name=>fs.existsSync(name+'/index.html'))],
            ['23 SEO product pages exist',models.every(name=>fs.existsSync('products/'+name+'/index.html'))],
            ['homepage links to full catalogue',html.includes('href="catalogue/"')],
            ['new styles present',fs.existsSync('storefront.css')&&fs.existsSync('storefront.js')],
            ['domain sitemap present',fs.existsSync('sitemap.xml')&&fs.readFileSync('sitemap.xml','utf8').includes('https://khindrto.akizen.my/products/WM1248/')],
            ['agent disclosure on all pages',[...pages.map(x=>x+'/index.html'),...models.map(x=>'products/'+x+'/index.html')].every(path=>fs.readFileSync(path,'utf8').includes('Laman promosi bebas'))],
            ['customer links go to agent',fs.readFileSync('mohon/index.html','utf8').includes('wa.me/60174201247')],
            ['no false official status',!fs.readFileSync('mohon/index.html','utf8').includes('laman rasmi HQ')]
          ];
          for(const [description,passed] of shopChecks)console.log((passed?'PASS ':'FAIL ')+description);
          if([...checks,...shopChecks].some(([,passed])=>!passed))process.exit(1);
          NODE
